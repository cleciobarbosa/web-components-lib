<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <!-- jQuery e jQuery UI -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }

        .input-validate {
            border-bottom-color: red !important;
        }
    </style>

    <!-- <script src="web_components.js" defer></script> -->
    <script src="input_text.js" defer></script>
    <script src="input_checkbox.js" defer></script>
    <script src="input_badge.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="row">
            <input-text label="Nome" id="myInput" required disabled></input-text>
            <div class="input-group">
                <button class="btn btn-primary" id="mybutton">Habilitar</button>
                <button class="btn btn-primary ml-2" id="mybutton2">Desabilitar</button>
                <button class="btn btn-danger ml-2" id="validar" type="button">Validar</button>

            </div>
        </div>
        <div class="row">
            <div class="card">
                <div class="card-body">

                    <!-- Checkbox customizado -->
                    <input-checkbox  id="checkcTermos"
                    label="Aceito os termos e condições" id="termsCheckbox"></input-checkbox>
                    <button id="checkStatusButton" class="btn btn-primary mt-3">Verificar Status</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="container mt-5">
                <!-- Badge simples -->
                <bohm-badge text="Success" variant="success"></bohm-badge>
        
                <!-- Badge simples -->
                <bohm-badge text="Danger" variant="danger"></bohm-badge>

                <!-- Badge simples -->
                <bohm-badge text="Secondary" variant="secondary"></bohm-badge>

                <!-- Badge pill -->
                <bohm-badge text="Importante" variant="danger" pill></bohm-badge>
        
                <!-- Botão para alterar o badge -->
            </div>
        </div>
        <div class="row">
            <!-- <input-datepicker id="myDatepicker" label="Data"></input-datepicker> -->
        </div>
    </div>


    <script>
        $(document).ready(() => {
            $('#myCheckbox').on('change', () => {
                // const checkbox = $('#myCheckbox')[0].inputElement;
                console.log('checked', $('#myCheckbox').prop('checked'));
            })
            $('#mybutton').on('click', () => {
                $('#myInput').prop('disabled', false);

                $('#myInput').prop('required', false);
            });
            $('#mybutton2').on('click', () => {
                $('#myInput').prop('disabled', true);

                $('#myInput').prop('required', false);
            });

            $('#validar').on('click', function () {
                $('#myInput').addClass('input-validate');
            })

            $('#checkStatusButton').on('click', function(){
                console.log('Checked', $('#checkcTermos').prop('checked'))
                console.log('val', $('#checkcTermos').val())
            })
        });
    </script>
</body>

</html>
